name: Documentation
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner image; lets a newer image be checked before ubuntu-latest moves to it'
        type: choice
        options: [ubuntu-latest, ubuntu-24.04, ubuntu-26.04]
        default: ubuntu-latest
permissions:
  contents: write
  pull-requests: read
  statuses: write
jobs:
  docs:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries for the Cairo/Makie stack (the walkthrough renders figures)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglib2.0-0 libcairo2 libpango-1.0-0 libpangocairo-1.0-0
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Build and deploy the documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia docs/make.jl   # self-activating; deploydocs pushes to gh-pages
