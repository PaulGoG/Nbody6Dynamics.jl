name: CI
# Dormant until the public launch: manual dispatch only. Triggers to restore
# then: push to main and to tags, and pull_request.
on:
  workflow_dispatch:
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']   # LTS + current stable
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries for the Cairo/Makie stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglib2.0-0 libcairo2 libpango-1.0-0 libpangocairo-1.0-0
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
        with:
          # cache-name busts the depot poisoned by the first (pre-fix) runs:
          # a broken artifact extraction persisted across restores.
          cache-name: julia-cache-v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
