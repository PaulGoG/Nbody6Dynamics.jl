name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']   # LTS + current stable
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries for the Cairo/Makie stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglib2.0-0 libcairo2 libpango-1.0-0 libpangocairo-1.0-0
      - name: Resolve fresh on CI
        # The committed Manifest is the workstation's (Julia 1.12) exact
        # environment; CI resolves from Project.toml instead, which also
        # exercises the [compat] bounds on every tested Julia version.
        run: rm -f Manifest.toml
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
        with:
          # cache-name busts the depot poisoned by the first (pre-fix) runs:
          # a broken artifact extraction persisted across restores.
          cache-name: julia-cache-v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
