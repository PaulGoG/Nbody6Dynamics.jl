name: Format check
# Dormant until the public launch: manual dispatch only. Triggers to restore
# then: push to main and pull_request.
on:
  workflow_dispatch:
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Check formatting
        run: |
          julia -e '
            using Pkg; Pkg.add("JuliaFormatter")
            using JuliaFormatter
            format(".") || begin
              @error "Files are not formatted per .JuliaFormatter.toml (diff follows)"
              run(`git diff`)
              exit(1)
            end'
