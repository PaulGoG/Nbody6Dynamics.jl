name: CompatHelper
on:
  schedule:
    - cron: '0 3 * * 1'   # weekly, Monday 03:00 UTC
  workflow_dispatch:
jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      # CompatHelper on the current stable Julia rejects the Random stdlib
      # compat entry ("not found in any of the registries"); the LTS handles it.
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Run CompatHelper
        run: |
          julia -e '
            using Pkg; Pkg.add("CompatHelper")
            using CompatHelper
            CompatHelper.main()'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
