name: Docs build
# Dormant until the public launch: manual dispatch only. Triggers to restore
# then: push to main and pull_request.
on:
  workflow_dispatch:
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Build documentation (build-only while private)
        run: julia docs/make.jl   # self-activating (develops the package by path)
