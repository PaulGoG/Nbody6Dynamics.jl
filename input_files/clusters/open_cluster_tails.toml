# Open cluster of Hyades-like mass on a circular orbit at the solar radius, escapers kept: 2500 stars, binary fraction 0.5, 650 Myr

[merger]
seed = 66503
n_clusters = 1
orbit_mode = "single"

[merger.cluster1]
model = "plummer"
N = 2500             # number of stars (pairs included)
rbar = 2.6          # half-mass radius [pc]
imf = "kroupa"
body1 = 150.0       # upper IMF bound [M☉]
bodyn = 0.08        # lower IMF bound [M☉]

[merger.cluster1.binaries]
fraction = 0.5      # binary fraction by systems; 0 ≤ fraction < 1
pairing = "random"  # one of: "random" | "uniform_q"
period = "kroupa1995"   # one of: "kroupa1995" | "loguniform"
eccentricity = "thermal"   # one of: "thermal" | "circular"

[merger.output]
format = "nbody"
tcrit_myr = 650.0   # end time [Myr]
dtadj_myr = 1.0     # adjustment interval [Myr]
deltat_myr = 5.0    # snapshot interval [Myr]

[merger.stellar]
level = "C"         # one of: "A" | "B" | "C" | "0"
zmet = 0.02         # metal abundance; 0.0001 ≤ zmet ≤ 0.03
dtplot_myr = 5.0    # stellar-evolution diagnostic interval [Myr]; ≥ deltat

[merger.tidal]
kz14 = 2            # one of: 0 | 1 | 2 | 5
gmg = 1.0e11        # galaxy mass [M☉]; > 0
rg0 = 8.5           # galactocentric radius of the circular orbit [kpc]; > 0

[merger.nbody6]
preset = "campaign"  # one of: "engine" | "campaign"
qe = 0.01           # energy-error tolerance per adjustment interval; > 0
checkpoint = true   # restart dump at every adjustment; bound the disk with simulation.checkpoint_keep

[merger.nbody6.kz]
"23" = 0            # KZ(23): escapers kept (0) so the tails stay in the integration
