# Runaway stellar collisions in a dense young cluster: 100 000 stars, W0 = 9, half-mass radius 0.5 pc, isolated, 20 Myr

[merger]
seed = 73219
n_clusters = 1
orbit_mode = "single"

[merger.cluster1]
model = "king"
N = 100000           # number of stars (pairs included)
W0 = 9.0
rbar = 0.5          # half-mass radius [pc]
imf = "kroupa"
body1 = 150.0       # upper IMF bound [M☉]
bodyn = 0.08        # lower IMF bound [M☉]

[merger.output]
format = "nbody"
tcrit_myr = 20.0    # end time [Myr]
dtadj_myr = 0.05    # adjustment interval [Myr]
deltat_myr = 0.05   # snapshot interval [Myr]

[merger.stellar]
level = "C"         # one of: "A" | "B" | "C" | "0"
zmet = 0.001        # metal abundance; 0.0001 ≤ zmet ≤ 0.03
dtplot_myr = 0.05   # stellar-evolution diagnostic interval [Myr]; ≥ deltat

[merger.nbody6]
preset = "campaign"  # one of: "engine" | "campaign"
qe = 0.01           # energy-error tolerance per adjustment interval; > 0
checkpoint = true   # restart dump at every adjustment; bound the disk with simulation.checkpoint_keep
