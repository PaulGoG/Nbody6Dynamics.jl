# Globular cluster with a black-hole subsystem: 100 000 stars, binary fraction 0.05, metal-poor, point-mass tide at 8 kpc, 2 Gyr

[merger]
seed = 41827
n_clusters = 1
orbit_mode = "single"

[merger.cluster1]
model = "king"
N = 100000           # number of stars (pairs included)
W0 = 6.0
rbar = 3.0          # half-mass radius [pc]
imf = "kroupa"
body1 = 150.0       # upper IMF bound [M☉]
bodyn = 0.08        # lower IMF bound [M☉]

[merger.cluster1.binaries]
fraction = 0.05     # binary fraction by systems; 0 ≤ fraction < 1
pairing = "random"  # one of: "random" | "uniform_q"
period = "loguniform"   # one of: "kroupa1995" | "loguniform"
a_min = 0.01        # semi-major axis lower bound [AU] for "loguniform"
a_max = 100.0       # semi-major axis upper bound [AU] for "loguniform"
eccentricity = "thermal"   # one of: "thermal" | "circular"

[merger.output]
format = "nbody"
tcrit_myr = 2000.0  # end time [Myr]
dtadj_myr = 0.5     # adjustment interval [Myr]
deltat_myr = 1.0    # snapshot interval [Myr]

[merger.stellar]
level = "C"         # one of: "A" | "B" | "C" | "0"
zmet = 0.0002       # metal abundance; 0.0001 ≤ zmet ≤ 0.03
dtplot_myr = 1.0    # stellar-evolution diagnostic interval [Myr]; ≥ deltat

[merger.tidal]
kz14 = 2            # one of: 0 | 1 | 2 | 5
gmg = 1.0e11        # galaxy mass [M☉]; > 0
rg0 = 8.0           # galactocentric radius of the circular orbit [kpc]; > 0

[merger.nbody6]
preset = "campaign"  # one of: "engine" | "campaign"
qe = 0.01           # energy-error tolerance per adjustment interval; > 0
checkpoint = true   # restart dump at every adjustment; bound the disk with simulation.checkpoint_keep
