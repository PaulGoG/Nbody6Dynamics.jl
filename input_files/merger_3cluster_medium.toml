# =============================================================================
# 3-cluster merger — medium run (explicit positions)
# =============================================================================
# Equilateral triangle: side ~16 pc, centred at origin.
# Mixed models: 2 King + 1 Plummer. Inward radial velocities.
# N~12000 total, TCRIT=10 NB units.

[merger]
n_clusters = 3
orbit_mode = "explicit"

[merger.cluster1]
model = "king"
N = 4000
W0 = 5.0
mass_total = 4e4
rbar = 1.8
imf = "kroupa"
body1 = 100.0
bodyn = 0.08
position = [-8.0, 0.0, 0.0]
velocity = [1.2, 0.0, 0.0]

[merger.cluster2]
model = "king"
N = 4000
W0 = 6.0
mass_total = 4e4
rbar = 1.8
imf = "kroupa"
body1 = 100.0
bodyn = 0.08
position = [4.0, 6.93, 0.0]
velocity = [-0.6, -1.04, 0.0]

[merger.cluster3]
model = "plummer"
N = 3000
mass_total = 2.5e4
rbar = 1.5
imf = "kroupa"
body1 = 100.0
bodyn = 0.08
position = [4.0, -6.93, 0.0]
velocity = [-0.6, 1.04, 0.0]

[merger.output]
format = "nbody"
truncate_jacobi = true
output_dir = "."
tcrit = 10.0
dtadj = 0.5
deltat = 0.5
