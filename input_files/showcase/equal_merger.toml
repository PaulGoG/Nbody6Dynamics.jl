# Equal-mass King clusters on an eccentric orbit that coalesces within the run.
# Intervals in Myr; the generator converts them with the realised time unit.
# A hard binary forms in the remnant without primordial binaries and carries a
# large share of the binding energy, so the relaxed tolerance is needed here too.

[merger]
seed = 21
n_clusters = 2
orbit_mode = "kepler"

[merger.cluster1]
model = "king"
N = 4000
W0 = 6.0
rbar = 1.0          # half-mass radius [pc]
imf = "kroupa"
body1 = 50.0
bodyn = 0.1

[merger.cluster2]
model = "king"
N = 4000
W0 = 6.0
rbar = 1.0
imf = "kroupa"
body1 = 50.0
bodyn = 0.1

[merger.orbit]
apocentre = 6.0     # [pc]
eccentricity = 0.9

[merger.output]
format = "nbody"
truncate_jacobi = true
tcrit_myr = 20.0
dtadj_myr = 0.5
deltat_myr = 1.0

[merger.nbody6]
qe = 0.01           # energy-error tolerance of the ADJUST check

[merger.stellar]
dtplot_myr = 2.0
