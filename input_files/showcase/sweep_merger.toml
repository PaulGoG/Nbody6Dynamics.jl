# Base configuration of the showcase sweep: two equal King clusters, 2 pc
# half-mass radii on a 10 pc orbit (the geometry of the showcase document).

[merger]
seed = 1
n_clusters = 2
orbit_mode = "kepler"

[merger.cluster1]
model = "king"
N = 500
W0 = 6.0
rbar = 2.0
imf = "kroupa"
body1 = 50.0
bodyn = 0.1

[merger.cluster2]
model = "king"
N = 500
W0 = 6.0
rbar = 2.0
imf = "kroupa"
body1 = 50.0
bodyn = 0.1

[merger.orbit]
apocentre = 10.0
eccentricity = 0.5

[merger.output]
format = "nbody"
truncate_jacobi = true
tcrit_myr = 12.0
dtadj_myr = 0.5
deltat_myr = 1.0

[merger.stellar]
dtplot_myr = 4.0
