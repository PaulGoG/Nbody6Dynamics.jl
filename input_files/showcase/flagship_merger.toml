# Two equal King clusters of 25 000 stars on a wide eccentric orbit, followed for 50 Myr

[merger]
seed = 31
n_clusters = 2
orbit_mode = "kepler"

[merger.cluster1]
model = "king"
N = 25000
W0 = 6.0
rbar = 2.0          # half-mass radius [pc]
imf = "kroupa"
body1 = 100.0
bodyn = 0.08

[merger.cluster2]
model = "king"
N = 25000
W0 = 6.0
rbar = 2.0
imf = "kroupa"
body1 = 100.0
bodyn = 0.08

[merger.orbit]
apocentre = 10.0    # [pc]
eccentricity = 0.5

[merger.output]
format = "nbody"
truncate_jacobi = true
tcrit_myr = 50.0
dtadj_myr = 0.5
deltat_myr = 2.0

[merger.nbody6]
qe = 0.01           # energy-error tolerance of the ADJUST check

[merger.stellar]
dtplot_myr = 4.0
