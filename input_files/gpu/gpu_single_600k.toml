# Pipeline configuration of the CUDA binary on the single case of 6×10⁵ bodies (paths relative to this file); the build tree comes from gpu_pipeline.toml

[install]
enabled = false           # the tree below is built by gpu_pipeline.toml (or the validation driver) beforehand
install_dir = "../../backend/Nbody6PPGPU-beijing-gpu"
ref = "v2026.07-campaign.6"

[build]
configure_flags = ["--enable-mcmodel=large", "--with-par=b1m"]
enable_mpi = false
enable_hdf5 = false
enable_gpu = true
cuda_path = ""            # "" = auto-detect (CUDA_HOME, /usr/local/cuda, nvcc on PATH)
cuda_arch = []            # [] = compute capabilities from nvidia-smi
nvcc_flags = []
nproc = 0

[simulation]
run_test = true
input_file = "../engine/N1k_quick.inp"   # relative to this file; unused: merger.inp is generated
runs_dir = "../../runs"
binary_name = "nbody6++"
mpi_ranks = 1
omp_threads = 8           # host threads for the irregular force; >= 1
gpu_list = [0]            # device indices for the engine (<= 4 per process); [] = every visible device
run_id_prefix = "gpu_single600k"
monitor = true
telemetry_interval = 5.0
startup_timeout = 14400.0  # s; the first adjustment of 6×10⁵ bodies on a slow host takes over an hour with the AVX build
exit_grace = 600.0

[postprocess]
enabled = true
pair_sum_max_n = 100000   # ≥ 0; largest snapshot N for the O(N²) diagnostics; 0 disables them

[visualization]
enabled = true
format = "png"
dpi = 300
export_width = 6.5
column = ""
units = "physical"
output_dir = "plots"

[merger]
enabled = true
config_file = "single_600k.toml"

[cluster]
enabled        = false          # true submits the run as a chain of jobs (scripts/run_cluster.jl); needs simulation.wall_budget > 0
partition      = "GPU"          # the H200 node's partition
time_limit     = "36:00:00"     # the node's wall limit per job
cpus_per_task  = 8
mem            = "64G"
gres           = "gpu:1"
sbatch_options = ["--hint=nomultithread"]
prologue       = ["export JULIA_DEPOT_PATH=\"$HOME/data/julia-depot:\" JULIAUP_DEPOT_PATH=\"$HOME/data/juliaup\"", "export PATH=\"$HOME/.juliaup/bin:$HOME/data/cuda/bin:$PATH\"", "export CUDA_HOME=\"$HOME/data/cuda\""]
chain          = "resubmit"     # one of: "resubmit" | "dependency"
overhead       = 7200.0         # s; initial conditions and post-processing of 6×10⁵ bodies take over an hour each
