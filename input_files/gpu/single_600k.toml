# One King cluster of 600 000 stars at rest, two N-body time units: the single-cluster GPU-advantage probe above 5×10⁵ bodies

[merger]
seed = 41
n_clusters = 1
orbit_mode = "explicit"
virial_max_n = 1000000   # ≥ 1; largest N for the exact O(N²) virialisation (per cluster and combined)

[merger.cluster1]
model = "king"
N = 600000
W0 = 6.0
rbar = 2.0          # half-mass radius [pc]
imf = "kroupa"
body1 = 100.0
bodyn = 0.08
position = [0.0, 0.0, 0.0]
velocity = [0.0, 0.0, 0.0]

[merger.output]
format = "nbody"
truncate_jacobi = false
tcrit = 2.0         # N-body time units
dtadj = 0.25
deltat = 0.5

[merger.stellar]
dtplot = 1.0        # N-body time units; ≥ deltat

[merger.nbody6]
qe = 0.01           # energy-error tolerance of the ADJUST check
