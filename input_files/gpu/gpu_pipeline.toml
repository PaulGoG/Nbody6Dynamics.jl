# Pipeline configuration for a CUDA host (paths relative to this file): clones
# and builds the engine with CUDA into its own tree, then runs the merger below
# on the first device. Requires nvcc (CUDA >= 12.8 for RTX 50 series, >= 11.8
# for H100/H200), nvidia-smi, gfortran, gcc/g++, make and git.

[install]
enabled = true
install_dir = "../../backend/Nbody6PPGPU-beijing-gpu"   # separate tree: CPU and GPU objects differ
ref = "618d7a4"
reinstall = false
clean_build = true

[build]
configure_flags = ["--enable-mcmodel=large", "--with-par=b1m"]
enable_mpi = false
enable_hdf5 = false
enable_gpu = true
cuda_path = ""            # "" = auto-detect (CUDA_HOME, /usr/local/cuda, nvcc on PATH)
cuda_arch = []            # [] = compute capabilities from nvidia-smi; e.g. ["sm_90", "sm_120"] for one binary on H200 and RTX 50
nproc = 0                 # >= 0; 0 = every core

[simulation]
run_test = true
input_file = "../../input_files/N1k_quick.inp"   # unused: merger.inp is generated
runs_dir = "../../runs"
binary_name = "nbody6++"
mpi_ranks = 1
omp_threads = 8           # host threads for the irregular force; <= 32 per the engine's advice
gpu_list = [0]            # device indices for the engine (<= 4 per process); [] = every visible device
run_id_prefix = "gpu"
monitor = true
telemetry_interval = 5.0
startup_timeout = 900.0
exit_grace = 300.0

[postprocess]
enabled = true

[visualization]
enabled = true
format = "png"
dpi = 300
column = "double"
units = "physical"
output_dir = "plots"

[merger]
enabled = true
config_file = "merger_50k.toml"
