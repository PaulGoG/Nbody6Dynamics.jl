# Pipeline configuration of the AVX binary on the merger case of 6×10⁵ bodies (paths relative to this file); the build tree comes from cpu_pipeline.toml

[install]
enabled = false           # the tree below is built by cpu_pipeline.toml (or the validation driver) beforehand
install_dir = "../../backend/Nbody6PPGPU-beijing"
ref = "618d7a4"

[build]
configure_flags = ["--enable-mcmodel=large", "--with-par=b1m"]
enable_mpi = false
enable_hdf5 = false
enable_gpu = false
nproc = 0

[simulation]
run_test = true
input_file = "../N1k_quick.inp"   # relative to this file; unused: merger.inp is generated
runs_dir = "../../runs"
binary_name = "nbody6++"
mpi_ranks = 1
omp_threads = 8           # host threads for the irregular force; >= 1
run_id_prefix = "cpu_merger600k"
monitor = true
telemetry_interval = 5.0
startup_timeout = 3600.0  # s; the initial force and neighbour lists of 6×10⁵ bodies take minutes on the host
exit_grace = 600.0

[postprocess]
enabled = true

[visualization]
enabled = true
format = "png"
dpi = 300
export_width = 6.5
column = ""
units = "physical"
output_dir = "plots"

[merger]
enabled = true
config_file = "merger_600k.toml"
