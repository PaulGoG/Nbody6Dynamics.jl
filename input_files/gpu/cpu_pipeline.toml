# Pipeline configuration of the CPU reference build (paths relative to this file)

[install]
enabled = true
install_dir = "../../backend/Nbody6PPGPU-beijing"
ref = "618d7a4"
reinstall = false
clean_build = true

[build]
configure_flags = ["--enable-mcmodel=large", "--with-par=b1m"]
enable_mpi = false
enable_hdf5 = false
enable_gpu = false
nproc = 0

[simulation]
run_test = true
input_file = "../N1k_quick.inp"   # relative to this file; unused: merger.inp is generated
runs_dir = "../../runs"
binary_name = "nbody6++"
mpi_ranks = 1
omp_threads = 8
run_id_prefix = "cpu"
monitor = true
telemetry_interval = 5.0
startup_timeout = 900.0
exit_grace = 300.0

[postprocess]
enabled = true

[visualization]
enabled = true
format = "png"
dpi = 300
export_width = 6.5
column = ""
units = "physical"
output_dir = "plots"

[merger]
enabled = true
config_file = "merger_50k.toml"
