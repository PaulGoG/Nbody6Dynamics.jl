# =============================================================================
# 3-cluster merger — small demo (explicit positions)
# =============================================================================
# Equilateral triangle: side ~16 pc, centred at origin.
# Mixed models: 2 King + 1 Plummer. Inward radial velocities.

[merger]
n_clusters = 3
orbit_mode = "explicit"

[merger.cluster1]
model = "king"
N = 800
W0 = 5.0
mass_total = 8000.0
rbar = 1.8
imf = "kroupa"
body1 = 50.0
bodyn = 0.1
position = [-8.0, 0.0, 0.0]
velocity = [1.2, 0.0, 0.0]

[merger.cluster2]
model = "king"
N = 800
W0 = 6.0
mass_total = 8000.0
rbar = 1.8
imf = "kroupa"
body1 = 50.0
bodyn = 0.1
position = [4.0, 6.93, 0.0]
velocity = [-0.6, -1.04, 0.0]

[merger.cluster3]
model = "plummer"
N = 600
mass_total = 5000.0
rbar = 1.5
imf = "kroupa"
body1 = 50.0
bodyn = 0.1
position = [4.0, -6.93, 0.0]
velocity = [-0.6, 1.04, 0.0]

[merger.output]
format = "nbody"
truncate_jacobi = true
output_dir = "."
tcrit = 5.0
dtadj = 0.5
deltat = 1.0
