# Three small clusters (2 King + 1 Plummer) on an equilateral triangle of side 16 pc, inward velocities

[merger]
n_clusters = 3
orbit_mode = "explicit"

[merger.cluster1]
model = "king"
N = 800
W0 = 5.0
rbar = 1.8
imf = "kroupa"
body1 = 50.0
bodyn = 0.1
position = [-8.0, 0.0, 0.0]
velocity = [0.0199, 0, 0]

[merger.cluster2]
model = "king"
N = 800
W0 = 6.0
rbar = 1.8
imf = "kroupa"
body1 = 50.0
bodyn = 0.1
position = [4.0, 6.93, 0.0]
velocity = [-0.009949, -0.01725, 0]

[merger.cluster3]
model = "plummer"
N = 600
rbar = 1.5
imf = "kroupa"
body1 = 50.0
bodyn = 0.1
position = [4.0, -6.93, 0.0]
velocity = [-0.009949, 0.01725, 0]

[merger.output]
format = "nbody"
truncate_jacobi = true
output_dir = "."
tcrit = 5.0
dtadj = 0.5
deltat = 1.0
