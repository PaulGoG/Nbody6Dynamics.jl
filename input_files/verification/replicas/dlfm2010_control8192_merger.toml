# Control of the de la Fuente Marcos & de la Fuente Marcos 2010 replica: one Plummer cluster of 8192 stars with
# the same population and tide (the single-cluster reference of their Fig. 13).

[merger]
seed = 7502
n_clusters = 1
orbit_mode = "single"

[merger.cluster1]
N = 8192
rbar = 0.77         # half-mass radius [pc]
profile = { type = "plummer" }
imf = { type = "powerlaw", alpha = 2.35, bounds = [0.17, 10.0] }

[merger.output]
format = "nbody"
tcrit_myr = 210.0
dtadj_myr = 1.0
deltat_myr = 2.0

[merger.tidal]
kz14 = 1            # one of: 0 | 1 | 2 | 5

[merger.stellar]
level = "C"         # one of: "A" | "B" | "C" | "0"
zmet = 0.02
dtplot_myr = 10.0

[merger.nbody6]
preset = "baseline"  # one of: "engine" | "baseline"
nnbopt = 40         # the baseline value (100) leaves no admissible neighbour sphere for the outermost stars of an untruncated Plummer sphere: the engine loops in its start-up (FPOLY0)
qe = 0.01

[merger.nbody6.kz]
"23" = 0            # KZ(23): escapers kept
