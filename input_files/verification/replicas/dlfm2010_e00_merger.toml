# Replica of de la Fuente Marcos & de la Fuente Marcos 2010 (ApJ 719, 104, DOI 10.1088/0004-637X/719/1/104),
# q = 1 model with S_0 = 10 pc and e_0 = 0.0: two Plummer clusters of 4096 stars (R_vir = 1 pc, power-law IMF
# alpha = 2.35 on 0.17-10 Msun, Z = 0.02, stellar evolution, escapers kept) in the solar-circle tide.

[merger]
seed = 7502
n_clusters = 2
orbit_mode = "kepler"

[merger.cluster1]
N = 4096
rbar = 0.77         # half-mass radius [pc] (1.305 R_p, R_vir = 1 pc)
profile = { type = "plummer" }
imf = { type = "powerlaw", alpha = 2.35, bounds = [0.17, 10.0] }

[merger.cluster2]
N = 4096
rbar = 0.77
profile = { type = "plummer" }
imf = { type = "powerlaw", alpha = 2.35, bounds = [0.17, 10.0] }

[merger.orbit]
apocentre = 10.0    # [pc], the apoclustron S_0
eccentricity = 0.0
orbit_normal = [0, 0, 1]

[merger.output]
format = "nbody"
truncate_jacobi = false
tcrit_myr = 210.0
dtadj_myr = 1.0
deltat_myr = 2.0

[merger.tidal]
kz14 = 1            # one of: 0 | 1 | 2 | 5

[merger.stellar]
level = "C"         # one of: "A" | "B" | "C" | "0"
zmet = 0.02
dtplot_myr = 10.0

[merger.nbody6]
preset = "baseline"  # one of: "engine" | "baseline"
nnbopt = 40         # the baseline value (100) leaves no admissible neighbour sphere for the outermost stars of an untruncated Plummer sphere: the engine loops in its start-up (FPOLY0)
qe = 0.01

[merger.nbody6.kz]
"23" = 0            # KZ(23): escapers kept, as in the published runs
