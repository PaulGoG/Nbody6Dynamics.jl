# Static black hole of about the stellar mass at the centre of a 4096-star Kroupa cluster with stellar evolution:
# disruption radii from the stellar radii, r_t = R★ (M/m★)^(1/3), partial disruptions for γ = 5/3 (Guillochon &
# Ramirez-Ruiz 2013), 20 Myr.
[merger]
seed = 4417
n_clusters = 1
orbit_mode = "single"

[merger.cluster1]
N = 4096
rbar = 1.0          # half-mass radius [pc]
profile = { type = "plummer" }
imf = { type = "kroupa" }

[merger.mbh]
mass_msun = 2000.0  # black-hole mass [M☉]
rt_mode = "stellar" # one of: "fixed" | "stellar"
partial = "gamma53" # one of: "off" | "gamma43" | "gamma53"
response = "jeans"  # one of: "jeans" | "rigid"

[merger.output]
format = "nbody"
tcrit_myr = 20.0
dtadj_myr = 0.5
deltat_myr = 1.0

[merger.tidal]
kz14 = 0            # one of: 0 | 1 | 2 | 5 (isolated)

[merger.stellar]
kz19 = 3            # stellar evolution (SSE)
dtplot_myr = 1.0    # inert without stellar evolution; must be ≥ deltat

[merger.nbody6]
preset = "baseline"  # one of: "engine" | "baseline"
qe = 0.01
escapers = "keep"   # one of: "remove" | "keep"
