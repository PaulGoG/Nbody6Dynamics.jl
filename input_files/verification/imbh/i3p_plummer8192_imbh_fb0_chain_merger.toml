# IMBH validation block I3, Table 2 configuration of Trenti, Ardi, Mineshige & Hut (2007, DOI
# 10.1111/j.1365-2966.2006.11189.x): Plummer model of 8192 equal-mass systems with a central IMBH of 0.014 of the total mass,
# no primordial binaries, isolated, point masses, 650 Myr ≈ 24 t_rh(0).
# Chain set: triple, quad and chain regularisation (KZ(15) = 2), hierarchical mergers (KZ(18) = 1), slow-down of KS and
# chain motion (KZ(26) = 2) and chain diagnostics (KZ(30) = 2), as in the paper's runs; the `_fb*_` configurations without
# `_chain` keep the IMBH's encounters in KS.

[merger]
seed = 8311
n_clusters = 1
orbit_mode = "single"

[merger.cluster1]
N = 8192
rbar = 1.0          # half-mass radius [pc]
profile = { type = "plummer" }
imf = { type = "equal", particle_mass = 1.0 }   # [M☉]
# no primordial binaries
imbh = { mass_fraction = 0.0142, velocity = "rest", response = "jeans" }   # M• = 0.014 of the total mass

[merger.output]
format = "nbody"
tcrit_myr = 650.0   # ≈ 24 t_rh(0) (t_rh ≈ 27 Myr)
dtadj_myr = 0.5
deltat_myr = 2.0

[merger.tidal]
kz14 = 0            # one of: 0 | 1 | 2 | 5 (isolated)

[merger.stellar]
kz19 = 0            # point masses
dtplot_myr = 2.0    # inert without stellar evolution; must be ≥ deltat

[merger.nbody6]
preset = "baseline"  # one of: "engine" | "baseline"
qe = 0.01
escapers = "keep"   # one of: "remove" | "keep"
imbh_output_dt_myr = 1.0
checkpoint = true   # restart dump at every adjustment (KZ(2) = 1)


[merger.nbody6.kz]
"15" = 2            # KZ(15): triple, quad and chain regularisation
"18" = 1            # KZ(18): hierarchical mergers
"26" = 2            # KZ(26): slow-down of KS and chain motion
"30" = 2            # KZ(30): chain diagnostics in the stdout
