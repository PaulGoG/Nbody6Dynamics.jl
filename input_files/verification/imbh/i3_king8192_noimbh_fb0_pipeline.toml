# Pipeline configuration of the IMBH validation run "i0_king8192" (roadmap 10.8; paths relative to this file)

[install]
enabled = false
install_dir = "../../../backend/Nbody6PPGPU-beijing"
ref = "v2026.07.13"

[build]
configure_flags = ["--enable-mcmodel=large", "--with-par=b1m"]
enable_mpi = false
enable_hdf5 = false
enable_gpu = false
nproc = 0

[simulation]
run_test = true
input_file = "../../engine/N1k_quick.inp"   # unused: merger.inp is generated
runs_dir = "../../../runs"
binary_name = "nbody6++"
mpi_ranks = 1
omp_threads = 2
run_id_prefix = "imbh_i3_king8192_noimbh_fb0"
monitor = false
telemetry_interval = 10.0
startup_timeout = 600.0
stall_timeout = 1800.0

[postprocess]
enabled = true

[visualization]
enabled = true
format = "png"
dpi = 300
export_width = 6.5
column = ""
units = "physical"
output_dir = "plots"

[merger]
enabled = true
config_file = "i3_king8192_noimbh_fb0_merger.toml"
