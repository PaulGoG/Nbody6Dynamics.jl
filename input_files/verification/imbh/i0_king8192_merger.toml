# IMBH validation block I0 (numerics smoke; IMBH study §4.4): a King W0 = 7 cluster of 8192 equal-mass particles with a
# central IMBH of 1 % of the stellar mass at rest, isolated, no stellar evolution, kz24 route; 40 N-body time units.

[merger]
seed = 8101
n_clusters = 1
orbit_mode = "single"

[merger.cluster1]
N = 8192
rbar = 1.0          # half-mass radius [pc]
profile = { type = "king", W0 = 7.0 }
imf = { type = "equal", particle_mass = 1.0 }   # [M☉]
imbh = { mass_fraction = 0.01, velocity = "rest", response = "rigid" }

[merger.output]
format = "nbody"
tcrit_myr = 6.6     # 40 N-body units (T* = 0.165 Myr)
dtadj_myr = 0.0824  # 0.5 N-body units
deltat_myr = 0.0824

[merger.tidal]
kz14 = 0            # one of: 0 | 1 | 2 | 5 (isolated)

[merger.stellar]
kz19 = 0            # point masses

[merger.nbody6]
preset = "baseline"  # one of: "engine" | "baseline"
qe = 0.01
escapers = "keep"   # one of: "remove" | "keep"
imbh_output_dt_myr = 0.0824   # mbh.45 cadence, 0.5 N-body units
