# IMBH validation block I3, Table 2 configuration of Trenti, Ardi, Mineshige & Hut (2007, DOI
# 10.1111/j.1365-2966.2006.11189.x): Plummer model of 8192 equal-mass systems without an IMBH,
# 10 % primordial binaries (5–680 kT, flat in log E_b, thermal e), isolated, point masses, chain regularisation, 650 Myr ≈ 24 t_rh(0).

[merger]
seed = 8314
n_clusters = 1
orbit_mode = "single"

[merger.cluster1]
N = 9011           # stars: 8192 systems with f_b = 0.1 (819 pairs)
rbar = 1.0          # half-mass radius [pc]
profile = { type = "plummer" }
imf = { type = "equal", particle_mass = 1.0 }   # [M☉]
binaries = { fraction = 0.1, period = "loguniform", a_min = 0.1194, a_max = 16.24, eccentricity = "thermal" }   # 5–680 kT flat in log E_b [AU]
# no IMBH: the control

[merger.output]
format = "nbody"
tcrit_myr = 650.0   # ≈ 24 t_rh(0) (t_rh ≈ 27 Myr)
dtadj_myr = 0.5
deltat_myr = 2.0

[merger.tidal]
kz14 = 0            # one of: 0 | 1 | 2 | 5 (isolated)

[merger.stellar]
kz19 = 0            # point masses
dtplot_myr = 2.0    # inert without stellar evolution; must be ≥ deltat

[merger.nbody6]
preset = "baseline"  # one of: "engine" | "baseline"
qe = 0.01
escapers = "keep"   # one of: "remove" | "keep"
imbh_output_dt_myr = 1.0

[merger.nbody6.kz]
15 = 2              # chain and stable hierarchies
18 = 1              # hierarchy census
26 = 2              # KS and chain slow-down
