# Two identical King clusters of 50 000 stars, q = 1, on an eccentric bound orbit

[merger]
n_clusters = 2
orbit_mode = "kepler"            # auto-compute positions from Kepler orbit

[merger.cluster1]
model = "king"
N = 50000
W0 = 6.0                        # King central potential
rbar = 2.0                      # Half-mass radius [pc]
imf = "kroupa"
body1 = 100.0                   # Upper mass limit [M☉]
bodyn = 0.08                    # Lower mass limit [M☉]

[merger.cluster2]
model = "king"
N = 50000
W0 = 6.0
rbar = 2.0
imf = "kroupa"
body1 = 100.0
bodyn = 0.08

[merger.orbit]
apocentre = 15.0                 # apocentre separation [pc]
eccentricity = 0.7               # 0 ≤ e < 1

[merger.output]
format = "nbody"                 # N-body units (KZ(22)=2)
truncate_jacobi = true           # Truncate at mutual Jacobi radius
output_dir = "."
