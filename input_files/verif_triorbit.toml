# =============================================================================
# Verification run — tri-cluster bound Lagrange triangle
# =============================================================================
# Three equal-mass clusters on an equilateral triangle at r = 6 pc from COM,
# rotating tangentially (CCW) with Lagrange-equilibrium velocities so the
# configuration is bound and persistent (no radial infall).
#
#   ω² = G m / (√3 r³)
#   with G = 1, m = 900 M☉ (N = 1500 equal bodies of 0.6 M☉, so the
#   equilibrium is exact and no massive stars evolve within the run),
#   r = 6 pc  →  ω ≈ 1.551,  |v| = ω r ≈ 9.306 code units (≈ 0.61 km/s per
#   cluster). Velocity of cluster i at position (x_i, y_i):
#   v_i = ω (−y_i, x_i, 0)  [counter-clockwise].
#
# Expected behaviour: the three cluster COMs trace a slowly rotating,
# near-equilateral triangle while each cluster relaxes internally. With
# stellar evolution active (Level C defaults), BSE mass loss drives a slow
# symmetric adiabatic expansion of the triangle (all three separations grow
# together, ~×2 over 20 NB) — the pairwise distances must stay equal; any
# asymmetric growth or shrinking triangle indicates broken equilibrium
# velocities. Good test of `_cluster_com_trajectories` and the virial
# snapshot for *separated* stable clusters.

[merger]
n_clusters = 3
orbit_mode = "explicit"
seed       = 7

# Cluster 1 — at (+r, 0, 0), v tangential (+y)
[merger.cluster1]
model      = "king"
N          = 1500
W0         = 6.0
mass_total = 900.0
rbar       = 1.0
imf        = "equal"
position   = [6.0, 0.0, 0.0]
velocity   = [0.0, 9.306, 0.0]

# Cluster 2 — at (-3, +5.196, 0), v = ω(−y, x, 0) = (-32.90, -19.00, 0)
[merger.cluster2]
model      = "king"
N          = 1500
W0         = 6.0
mass_total = 900.0
rbar       = 1.0
imf        = "equal"
position   = [-3.0, 5.196, 0.0]
velocity   = [-8.059, -4.653, 0.0]

# Cluster 3 — at (-3, -5.196, 0), v = ω(−y, x, 0) = (+32.90, -19.00, 0)
[merger.cluster3]
model      = "king"
N          = 1500
W0         = 6.0
mass_total = 900.0
rbar       = 1.0
imf        = "equal"
position   = [-3.0, -5.196, 0.0]
velocity   = [8.059, -4.653, 0.0]

[merger.output]
format          = "nbody"
truncate_jacobi = true
output_dir      = "."
tcrit           = 20.0
dtadj           = 0.5
deltat          = 0.5
