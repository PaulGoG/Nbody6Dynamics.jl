# Verification: three equal-mass clusters on a rotating Lagrange-equilibrium triangle of radius 6 pc

[merger]
n_clusters = 3
orbit_mode = "explicit"
seed       = 7

[merger.cluster1]
model      = "king"
N          = 1500
W0         = 6.0
mass_total = 900.0
rbar       = 1.0
imf        = "equal"
position   = [6.0, 0.0, 0.0]
velocity   = [0.0, 0.6103, 0.0]

[merger.cluster2]
model      = "king"
N          = 1500
W0         = 6.0
mass_total = 900.0
rbar       = 1.0
imf        = "equal"
position   = [-3.0, 5.196, 0.0]
velocity   = [-0.5285, -0.3052, 0.0]

[merger.cluster3]
model      = "king"
N          = 1500
W0         = 6.0
mass_total = 900.0
rbar       = 1.0
imf        = "equal"
position   = [-3.0, -5.196, 0.0]
velocity   = [0.5285, -0.3052, 0.0]

[merger.output]
format          = "nbody"
truncate_jacobi = true
output_dir      = "."
tcrit           = 20.0
dtadj           = 0.5
deltat          = 0.5
