# Validation campaign V0, block P0: bring-up of the GPU node. The job clones the engine fork at the pinned tag, builds
# the CUDA engine for the H200 (sm_90) and runs the 1000-body smoke input on every device the job holds.
#   julia scripts/run_cluster.jl input_files/campaign/validation/p0/p0_setup.toml --run-id=p0_setup

[install]
enabled = true
source_url = "https://github.com/PaulGoG/Nbody6PPGPU-beijing.git"
ref = "v2026.07.26"
install_dir = "../../../../backend/Nbody6PPGPU-beijing-gpu"   # nonempty; shared by every later campaign config
reinstall = false
clean_build = true

[build]
configure_flags = ["--enable-mcmodel=large", "--with-par=b1m"]
enable_mpi = false
enable_hdf5 = false
enable_gpu = true
cuda_path = ""            # "" = auto-detect; the toolkit P0 records is pinned in every later config
cuda_arch = ["sm_90"]     # H200
nproc = 0                 # ≥ 0; 0 = auto-detect

[simulation]
run_test = true
input_file = "../../../engine/N1k_quick.inp"
runs_dir = "../../../../runs/campaign/p0"
binary_name = "nbody6++"
omp_threads = 8           # ≥ 1
gpu_list = []             # [] = every device the job holds
run_id_prefix = "p0"
monitor = false
telemetry_interval = 5.0  # s; ≥ 0
startup_timeout = 1800.0  # s; ≥ 0
exit_grace = 600.0        # s; ≥ 0
wall_budget = 3600.0      # s; ≥ 0
stop_margin = 300.0       # s; < wall_budget

[postprocess]
enabled = true

[visualization]
enabled = false

[merger]
enabled = false
config_file = ""

[cluster]
enabled = true
partition = "GPU"
time_limit = "04:00:00"
cpus_per_task = 16
mem = "64G"
gres = "gpu:2"            # both devices, so the smoke run sees each
sbatch_options = ["--hint=nomultithread"]
prologue = ["export JULIA_DEPOT_PATH=\"$HOME/data/julia-depot:\" JULIAUP_DEPOT_PATH=\"$HOME/data/juliaup\"",
            "export PATH=\"$HOME/.juliaup/bin:$PATH\""]
chain = "resubmit"        # one of: "resubmit" | "dependency"
max_segments = 1          # ≥ 0; one job
overhead = 3600.0         # s; clone and CUDA build
