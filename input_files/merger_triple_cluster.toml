# =============================================================================
# Triple cluster merger (explicit positions)
# =============================================================================
# Three clusters in a triangular configuration, converging toward a common
# centre. Demonstrates the explicit orbit mode for N > 2 clusters.
#
# Geometry: equilateral triangle with side length 20 pc, centred at origin.
# Each cluster has inward radial velocity to initiate inspiral.
#
# Usage:
#   using Nbody6Dynamics
#   result = run_merger_pipeline("input_files/merger_triple_cluster.toml")

[merger]
n_clusters = 3
orbit_mode = "explicit"          # user-specified positions and velocities

[merger.cluster1]
model = "king"
N = 30000
W0 = 5.0
mass_total = 8e4                 # 8 × 10^4 M☉
rbar = 2.0                      # Half-mass radius [pc]
imf = "kroupa"
body1 = 100.0
bodyn = 0.08
position = [-10.0, 0.0, 0.0]    # [pc] — left vertex
velocity = [1.5, 0.0, 0.0]      # inward toward centre

[merger.cluster2]
model = "king"
N = 30000
W0 = 5.0
mass_total = 8e4
rbar = 2.0
imf = "kroupa"
body1 = 100.0
bodyn = 0.08
position = [5.0, 8.66, 0.0]     # [pc] — upper-right vertex
velocity = [-0.75, -1.3, 0.0]   # inward

[merger.cluster3]
model = "plummer"
N = 20000
mass_total = 5e4                 # Lighter third cluster
rbar = 1.5
imf = "kroupa"
body1 = 100.0
bodyn = 0.08
position = [5.0, -8.66, 0.0]    # [pc] — lower-right vertex
velocity = [-0.75, 1.3, 0.0]    # inward

[merger.output]
format = "nbody"
truncate_jacobi = true
output_dir = "."
