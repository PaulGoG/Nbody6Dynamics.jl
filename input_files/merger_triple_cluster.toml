# =============================================================================
# Triple cluster merger (explicit positions)
# =============================================================================
# Three converging clusters on an equilateral 20 pc triangle
# (explicit orbit mode for N > 2 clusters).

[merger]
n_clusters = 3
orbit_mode = "explicit"          # user-specified positions and velocities

[merger.cluster1]
model = "king"
N = 30000
W0 = 5.0
rbar = 2.0                      # Half-mass radius [pc]
imf = "kroupa"
body1 = 100.0
bodyn = 0.08
position = [-10.0, 0.0, 0.0]    # [pc] — left vertex
velocity = [0.04599, 0, 0]      # inward toward centre

[merger.cluster2]
model = "king"
N = 30000
W0 = 5.0
rbar = 2.0
imf = "kroupa"
body1 = 100.0
bodyn = 0.08
position = [5.0, 8.66, 0.0]     # [pc] — upper-right vertex
velocity = [-0.023, -0.03986, 0]   # inward

[merger.cluster3]
model = "plummer"
N = 20000
rbar = 1.5
imf = "kroupa"
body1 = 100.0
bodyn = 0.08
position = [5.0, -8.66, 0.0]    # [pc] — lower-right vertex
velocity = [-0.023, 0.03986, 0]    # inward

[merger.output]
format = "nbody"
truncate_jacobi = true
output_dir = "."
