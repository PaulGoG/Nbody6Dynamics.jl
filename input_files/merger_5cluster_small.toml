# =============================================================================
# 5-cluster merger — small demo (explicit positions)
# =============================================================================
# Pentagon layout: 5 clusters on a circle of radius 10 pc, all moving inward.
# Mixed models: 3 King + 2 Plummer, varying masses.

[merger]
n_clusters = 5
orbit_mode = "explicit"

# Cluster 1: top vertex (12 o'clock)
[merger.cluster1]
model = "king"
N = 500
W0 = 5.0
rbar = 1.5
imf = "kroupa"
body1 = 50.0
bodyn = 0.1
position = [0.0, 10.0, 0.0]
velocity = [0, -0.0228, 0]

# Cluster 2: upper-right (1:12 o'clock)
[merger.cluster2]
model = "king"
N = 500
W0 = 6.0
rbar = 1.5
imf = "kroupa"
body1 = 50.0
bodyn = 0.1
position = [9.51, 3.09, 0.0]
velocity = [-0.02173, -0.006991, 0]

# Cluster 3: lower-right (4:48 o'clock)
[merger.cluster3]
model = "plummer"
N = 400
rbar = 1.2
imf = "kroupa"
body1 = 50.0
bodyn = 0.1
position = [5.88, -8.09, 0.0]
velocity = [-0.01337, 0.01839, 0]

# Cluster 4: lower-left (7:12 o'clock)
[merger.cluster4]
model = "plummer"
N = 400
rbar = 1.2
imf = "kroupa"
body1 = 50.0
bodyn = 0.1
position = [-5.88, -8.09, 0.0]
velocity = [0.01337, 0.01839, 0]

# Cluster 5: upper-left (10:48 o'clock)
[merger.cluster5]
model = "king"
N = 400
rbar = 1.3
imf = "kroupa"
body1 = 50.0
bodyn = 0.1
position = [-9.51, 3.09, 0.0]
velocity = [0.02173, -0.006991, 0]

[merger.output]
format = "nbody"
truncate_jacobi = true
output_dir = "."
tcrit = 5.0
dtadj = 0.5
deltat = 1.0
