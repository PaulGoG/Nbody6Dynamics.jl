# =============================================================================
# Minor merger with Plummer profiles (q = 0.1)
# =============================================================================
# A massive cluster accreting a smaller satellite on an inspiral orbit.

[merger]
n_clusters = 2
orbit_mode = "kepler"

[merger.cluster1]
model = "plummer"
N = 100000
rbar = 3.0                      # Half-mass radius [pc]
imf = "kroupa"
body1 = 100.0
bodyn = 0.08

[merger.cluster2]
model = "plummer"
N = 10000
rbar = 1.5                      # Compact satellite
imf = "kroupa"
body1 = 100.0
bodyn = 0.08

[merger.orbit]
apocentre = 20.0                 # pc — well separated
eccentricity = 0.5               # Moderate eccentricity

[merger.output]
format = "nbody"
truncate_jacobi = true
output_dir = "."
