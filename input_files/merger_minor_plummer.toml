# Minor merger of Plummer clusters, q = 0.1: a massive cluster accreting a satellite on an inspiral orbit

[merger]
n_clusters = 2
orbit_mode = "kepler"

[merger.cluster1]
model = "plummer"
N = 100000
rbar = 3.0                      # Half-mass radius [pc]
imf = "kroupa"
body1 = 100.0
bodyn = 0.08

[merger.cluster2]
model = "plummer"
N = 10000
rbar = 1.5                      # Half-mass radius [pc]
imf = "kroupa"
body1 = 100.0
bodyn = 0.08

[merger.orbit]
apocentre = 20.0                 # apocentre separation [pc]
eccentricity = 0.5               # 0 ≤ e < 1

[merger.output]
format = "nbody"
truncate_jacobi = true
output_dir = ""
