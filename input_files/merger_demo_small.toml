# Two equal-mass King clusters of 1000 stars on a Kepler orbit, small demo case

[merger]
n_clusters = 2
orbit_mode = "kepler"

[merger.cluster1]
model = "king"
N = 1000
W0 = 6.0
rbar = 2.0
imf = "kroupa"
body1 = 50.0
bodyn = 0.1

[merger.cluster2]
model = "king"
N = 1000
W0 = 6.0
rbar = 2.0
imf = "kroupa"
body1 = 50.0
bodyn = 0.1

[merger.orbit]
apocentre = 12.0
eccentricity = 0.6

[merger.output]
format = "nbody"
truncate_jacobi = true
output_dir = ""
tcrit = 5.0                      # end time [NB]
dtadj = 0.5                      # ADJUST diagnostic interval [NB]
deltat = 1.0                     # snapshot interval [NB]
