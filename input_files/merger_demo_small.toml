# =============================================================================
# Small equal-mass King merger for quick demo runs
# =============================================================================
# N=1000 per cluster — runs in seconds on a single core.
# Good for testing the full merger→simulation→postprocess→plot pipeline.

[merger]
n_clusters = 2
orbit_mode = "kepler"

[merger.cluster1]
model = "king"
N = 1000
W0 = 6.0
rbar = 2.0
imf = "kroupa"
body1 = 50.0
bodyn = 0.1

[merger.cluster2]
model = "king"
N = 1000
W0 = 6.0
rbar = 2.0
imf = "kroupa"
body1 = 50.0
bodyn = 0.1

[merger.orbit]
apocentre = 12.0
eccentricity = 0.6

[merger.output]
format = "nbody"
truncate_jacobi = true
output_dir = "."
tcrit = 5.0                      # Short run: 5 NB time units
dtadj = 0.5                      # ADJUST output every 0.5 NB
deltat = 1.0                     # Snapshot output every 1.0 NB
