# =============================================================================
# Nbody6Dynamics Configuration
# =============================================================================
# 27-cluster cubic grid merger: 3×3×3 lattice, mixed King + Plummer,
# Kroupa IMF, all clusters converging inward.  Total N ≈ 27 000.
# Full pipeline: merger IC → simulation → post-processing → plots.

[install]
enabled        = false           # binary already built
source_url     = "https://github.com/nbody6ppgpu/Nbody6PPGPU-beijing.git"
install_dir    = "backend/Nbody6PPGPU-beijing"
reinstall      = false
clean_build    = true

[build]
configure_flags = ["--enable-mcmodel=large", "--with-par=b1m"]
enable_mpi      = false
enable_hdf5     = true
enable_gpu      = false
cuda_path       = ""
nproc           = 0

[simulation]
run_test      = true
input_file    = "../../input_files/N25k_production.inp"   # fallback; overridden by merger.inp
runs_dir      = "runs"
binary_name   = "nbody6++"
mpi_ranks     = 1
run_id_prefix = "cubic27"
monitor       = true            # live progress ticker (interactive terminals only)

[postprocess]
enabled              = true
data_dir             = ""
snapshot_format      = "conf3"
snapshot_pattern     = "conf.3_*"
parse_stdout         = true
stdout_file          = "out1000"
read_lagr            = true
lagr_file            = "lagr.7"
read_escapers        = true
escapers_file        = "esc.11"
read_stellar_evo     = true
stellar_evo_pattern  = "sev.83_*"

[visualization]
enabled    = true
format     = "png"              # raster for inspection
dpi        = 300
column     = ""                 # use figsize
figsize    = [10, 8]
units      = "physical"         # pc, Myr, km/s, M☉
output_dir = "plots"

[visualization.style]
marker_budget       = 18000.0
marker_min          = 1.5       # smaller markers for dense 27k-particle field
marker_max          = 12.0
q_log_threshold     = 10.0
q_floor             = 1e-3
zoom_frac           = 0.15
anim_fps            = 0
anim_target_seconds = 15.0      # longer animation for more frames

[merger]
enabled     = true
config_file = "input_files/merger_27cluster_cubic.toml"
