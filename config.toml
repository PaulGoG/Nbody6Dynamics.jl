# =============================================================================
# Nbody6Dynamics Configuration
# =============================================================================
# Full-pipeline configuration for the 27-cluster cubic-grid merger scenario.

[install]
enabled        = false           # binary already built
source_url     = "https://github.com/nbody6ppgpu/Nbody6PPGPU-beijing.git"
ref            = "618d7a4"       # backend commit, tag, or branch checked out after cloning; "" = default branch
install_dir    = "backend/Nbody6PPGPU-beijing"   # nonempty
reinstall      = false
clean_build    = true

[build]
configure_flags = ["--enable-mcmodel=large", "--with-par=b1m"]
enable_mpi      = false
enable_hdf5     = true
enable_gpu      = false
cuda_path       = ""
cuda_arch       = []            # CUDA architectures, "sm_<major><minor>" (e.g. ["sm_90"]); [] = detect with nvidia-smi
nproc           = 0             # ≥ 0; 0 = auto-detect

[simulation]
run_test      = true
input_file    = "../../input_files/N25k_production.inp"   # nonempty; overridden by merger.inp
runs_dir      = "runs"          # nonempty
binary_name   = "nbody6++"
mpi_ranks     = 1               # ≥ 1; > 1 requires build.enable_mpi
omp_threads   = 0               # ≥ 0; 0 = OpenMP runtime default (all logical CPUs)
gpu_list      = []              # CUDA device indices for GPU_LIST; ≥ 0, distinct, ≤ 4 entries; [] = all; requires build.enable_gpu
run_id_prefix = "cubic27"       # nonempty
monitor       = true            # live progress ticker (interactive terminals only)
live_diagnostics = false        # in-terminal sparklines of Q and |ΔE/E| (with monitor; interactive only)
live_interval    = 30.0         # s; ≥ 1; period of the sparkline panel
telemetry_interval = 5.0        # s; ≥ 0; 0 disables the process/GPU sampler
startup_timeout    = 0.0        # s; ≥ 0; 0 disables the start-up watchdog
exit_grace         = 120.0      # s; ≥ 0; 0 disables the completion monitor (END RUN printed, no exit)

[postprocess]
enabled              = true
data_dir             = ""
snapshot_format      = "conf3"      # only supported value: "conf3"
snapshot_pattern     = "conf.3_*"   # nonempty
parse_stdout         = true
stdout_file          = "out1000"    # nonempty when parse_stdout = true
read_lagr            = true
lagr_file            = "lagr.7"     # nonempty when read_lagr = true
read_escapers        = true
escapers_file        = "esc.11"     # nonempty when read_escapers = true
read_stellar_evo     = true
stellar_evo_pattern  = "sev.83_*"   # nonempty when read_stellar_evo = true
read_binary_evo      = true
binary_evo_pattern   = "bev.82_*"   # nonempty when read_binary_evo = true

[visualization]
enabled    = true
format     = "png"              # one of: "pdf" | "svg" | "png"
dpi        = 300                # ≥ 72
column     = ""                 # one of: "single" | "double" | "" (use figsize)
figsize    = [10, 8]            # inches; both > 0
units      = "physical"         # one of: "physical" | "nbody"
output_dir = "plots"

[visualization.style]
marker_budget       = 18000.0   # > 0
marker_min          = 1.5       # 0 < marker_min ≤ marker_max
marker_max          = 12.0      # ≥ marker_min
q_log_threshold     = 10.0      # > 0
q_floor             = 1e-3      # 0 < q_floor < 1
zoom_frac           = 0.15      # 0 < zoom_frac ≤ 1
anim_fps            = 0         # ≥ 0; 0 = auto from frame count
anim_target_seconds = 15.0      # > 0

[merger]
enabled     = true
config_file = "input_files/merger_27cluster_cubic.toml"   # nonempty when enabled = true
