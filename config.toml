# Pipeline configuration of a checkout; the shipped default runs the small two-cluster demo merger

[install]
enabled        = false           # clone and build the engine before running
source_url     = "https://github.com/PaulGoG/Nbody6PPGPU-beijing.git"
ref            = "v2026.07-campaign.2"   # backend commit, tag, or branch checked out after cloning; "" = default branch
install_dir    = "backend/Nbody6PPGPU-beijing"   # nonempty
reinstall      = false
clean_build    = true

[build]
configure_flags = ["--enable-mcmodel=large", "--with-par=b1m"]
enable_mpi      = false
enable_hdf5     = true
enable_gpu      = false
cuda_path       = ""
cuda_arch       = []            # CUDA architectures, "sm_<major><minor>" (e.g. ["sm_90"]); [] = detect with nvidia-smi
nvcc_flags      = []            # extra nvcc options, e.g. ["-allow-unsupported-compiler"] or ["-ccbin", "gcc-14"]
nproc           = 0             # ≥ 0; 0 = auto-detect

[simulation]
run_test      = true
input_file    = "input_files/engine/N1k_quick.inp"         # nonempty, relative to this file; overridden by merger.inp
runs_dir      = "runs"          # nonempty
binary_name   = "nbody6++"
mpi_ranks     = 1               # ≥ 1; > 1 requires build.enable_mpi
omp_threads   = 0               # ≥ 0; 0 = OpenMP runtime default (all logical CPUs)
gpu_list      = []              # CUDA device indices for GPU_LIST; ≥ 0, distinct, ≤ 4 entries; [] = all; requires build.enable_gpu
run_id_prefix = "demo"          # nonempty
monitor       = true            # live progress ticker (interactive terminals only)
live_diagnostics = false        # in-terminal sparklines of Q and |ΔE/E| (with monitor; interactive only)
live_interval    = 30.0         # s; ≥ 1; period of the sparkline panel
telemetry_interval = 5.0        # s; ≥ 0; 0 disables the process/GPU sampler
startup_timeout    = 0.0        # s; ≥ 0; 0 disables the start-up watchdog
exit_grace         = 120.0      # s; ≥ 0; 0 disables the completion monitor (END RUN printed, no exit)
wall_budget        = 0.0        # s; ≥ 0; wall-clock budget of one engine segment; 0 = none
stop_margin        = 120.0      # s; ≥ 0 and < wall_budget; time the engine has to act on a stop request
checkpoint_keep    = 0          # 0 or ≥ 2; periodic restart dumps kept during a run; 0 = all (older ones are deleted otherwise)

[postprocess]
enabled              = true
data_dir             = ""
snapshot_format      = "conf3"      # only supported value: "conf3"
snapshot_pattern     = "conf.3_*"   # nonempty
parse_stdout         = true
stdout_file          = "out1000"    # nonempty when parse_stdout = true
read_lagr            = true
lagr_file            = "lagr.7"     # nonempty when read_lagr = true
read_escapers        = true
escapers_file        = "esc.11"     # nonempty when read_escapers = true
read_stellar_evo     = true
stellar_evo_pattern  = "sev.83_*"   # nonempty when read_stellar_evo = true
read_binary_evo      = true
binary_evo_pattern   = "bev.82_*"   # nonempty when read_binary_evo = true
events_file          = "event.35"   # engine counters per output time; nonempty when mass_budget = true
pair_sum_max_n       = 2000000      # ≥ 0; largest snapshot N for the O(N²) diagnostics (integrals, remnant, per-cluster virial and structure, bound-set hardness scale); 0 disables them
snapshot_integrals   = true         # write snapshot_integrals.csv (momenta, energies, bound set)
bound_max_passes     = 100          # ≥ 1; limit on bound-set unbinding passes
bound_min_members    = 10           # ≥ 2; systems below which a bound set counts as dissolved
energy_events        = true         # write energy_intervals.csv and engine_events.csv (per-interval energy changes, engine events)
energy_jump_threshold = 1.0e-4      # ≥ 0; |DE| floor for a flagged adjustment interval
energy_jump_sigma    = 5.0          # ≥ 0; flagged when |DE| ≥ max(threshold, sigma × robust scale of DE)
mass_budget          = true         # write mass_budget.csv (snapshots, escapers, stellar and collision mass loss)
centre_n_stop        = 1000         # ≥ 1; shrinking-sphere stop count (Power et al. 2003)
centre_stop_fraction = 0.01         # 0 < x ≤ 1; stop at this fraction of the set when smaller than centre_n_stop
centre_n_floor       = 500          # ≥ 1; floor of the shrinking-sphere stop count
centre_shrink        = 0.025        # 0 < x < 1; fractional reduction of the sphere membership per step
lagr_n_min           = 100          # ≥ 1; effective particles required inside and outside a Lagrangian radius
profile_nbins        = 12           # ≥ 2; maximum shells of a radial profile
profile_n_min_sigma  = 50           # ≥ 2; shell members required for the velocity dispersions
profile_n_min_beta   = 300          # ≥ profile_n_min_sigma; shell members required for the anisotropy
profile_n_min_density = 100         # ≥ 1; members per logarithmic density shell
density_neighbours   = 6            # ≥ 2; neighbour rank of the local density (Casertano & Hut 1985)
msr_n_tracer         = 50           # ≥ 2; size of the mass-segregation tracer class
msr_scan             = [10, 20, 50, 100, 200]   # ≥ 2 each, increasing; N_MST values of the segregation scan
msr_n_random         = 200          # ≥ 2; random comparison sets per N_MST above msr_n_small
msr_n_random_small   = 1000         # ≥ 2; random comparison sets per N_MST up to msr_n_small
msr_n_small          = 20           # ≥ 0; N_MST limit of msr_n_random_small
msr_seed             = 0            # ≥ 0; RNG seed of the segregation sets and the rotation null draws
msr_threshold        = 2.0          # > 0; Λ_MSR − σ above which the remnant counts as segregated
rotation_n_min       = 1000         # ≥ 2; effective members per rotation shell
rotation_nbins_max   = 16           # ≥ 1; maximum rotation shells
rotation_n_null      = 20           # ≥ 0; sign-flip null draws of the rotation floors
shape_n_min_shell    = 3000         # ≥ 1; members required in a shape-tensor shell
shape_n_min_enclosed = 7000         # ≥ 1; particles required inside a shape-tensor ellipsoid
pair_k               = 10           # ≥ 1; nearest neighbours searched by the snapshot pair finder
pair_tidal_factor    = 0.3333333333333333   # > 0; apocentre limit of a pair in units of the nearest third-body distance
relaxation_gamma     = [0.02, 0.11]             # > 0 each; Coulomb-logarithm arguments reported for t_rh
angular_momentum     = true         # write angular_momentum.csv (budget, rotation by radius and mass class, elapsed relaxation times)
mass_class_edges     = [0.5, 5.0]   # M☉; > 0, increasing; edges of the initial-mass classes
mass_class_n_min     = 100          # ≥ 2; bound members a class or a radial subset needs for its rotation measure
equipartition        = true         # write equipartition.csv (Bianchini m_eq of the luminous stars within r_h)
equipartition_bin_width = 0.1       # M☉; > 0; mass bin of the dispersion–mass relation
equipartition_n_min  = 50           # ≥ 2; stars a mass bin needs to enter the fit
merger_tree          = true         # write merger_tree.csv and progenitor_budget.csv for multi-cluster runs

[visualization]
enabled    = true
format     = "png"              # one of: "pdf" | "svg" | "png"
dpi          = 300              # minimum raster resolution at the printed width, ≥ 72
export_width = 6.5              # printed width of an export [in], > 0
column       = ""               # one of: "" | "single" | "double"; journal column width instead of export_width
units      = "physical"         # one of: "physical" | "nbody"
output_dir = "plots"

[visualization.style]
marker_budget       = 27000.0   # > 0
marker_min          = 2.2       # 0 < marker_min ≤ marker_max
marker_max          = 18.0      # ≥ marker_min
q_log_threshold     = 10.0      # > 0
q_floor             = 1e-3      # 0 < q_floor < 1
zoom_frac           = 0.15      # 0 < zoom_frac ≤ 1
anim_fps            = 0         # ≥ 0; 0 = auto from frame count
anim_target_seconds = 15.0      # > 0
anim_px_per_unit    = 1.4       # pixels per canvas unit of animation frames, > 0
snapshot_render     = "auto"    # one of: "auto" | "scatter" | "density"; auto = density from density_min_n particles on
density_min_n       = 20000     # ≥ 1
density_bins        = 400       # grid cells per axis of a density panel, 16–4096
density_decades     = 4.0       # colour range below the peak surface density [dex], > 0
density_mass_frac   = 0.99      # mass fraction whose extent sets the panel limits, 0 < f ≤ 1

[merger]
enabled     = true
config_file = "input_files/mergers/merger_demo_small.toml"   # nonempty when enabled = true

[cluster]
enabled         = false         # submit the run as a chain of scheduler jobs; requires simulation.wall_budget > 0
scheduler       = "slurm"       # one of: "slurm"
partition       = ""            # "" = not passed; same for account, qos
account         = ""
qos             = ""
job_name        = ""            # "" = the run id
time_limit      = "36:00:00"    # Slurm time format; wall_budget + stop_margin + overhead must fit
partition_limit = ""            # "" = unchecked; else time_limit ≤ partition_limit
nodes           = 1             # ≥ 1
ntasks          = 1             # ≥ 1
cpus_per_task   = 8             # ≥ 1
mem             = ""            # e.g. "64G"; "" = scheduler default
gres            = ""            # e.g. "gpu:1"; "" = none
exclusive       = false
sbatch_options  = []            # extra sbatch options without the "#SBATCH" prefix, e.g. ["--hint=nomultithread"]
prologue        = []            # shell lines run in the job before Julia (module loads, depot paths)
julia           = ""            # "" = the Julia that submits
julia_threads   = 0             # 0 = cpus_per_task
chain           = "resubmit"    # one of: "resubmit" | "dependency"
max_segments    = 0             # ≥ 0; 0 = until the run completes (resubmit only); dependency requires ≥ 1
overhead        = 1800.0        # s; ≥ 0; job time outside the engine's wall budget
sbatch          = "sbatch"      # nonempty

[cost]
enabled       = true            # estimate wall time, segments and disk at every engine launch
table         = []              # rows [N, s_per_nb]; [] = built-in table (one H200 NVL device, 8 host threads); ≥ 2 rows, increasing N
merger_factor = 2.0             # > 0; rate factor of a two-cluster configuration
budget_hours  = 0.0             # h; ≥ 0; 0 = no check
on_exceed     = "warn"          # one of: "warn" | "refuse"
