# The figure routines are a package extension: a headless host installs and
# runs the pipeline without the plotting stack, and only a session that loads
# a Makie backend pulls it in. MathTeXEngine is a dependency of Makie, so
# `using CairoMakie` satisfies both triggers at once.
[weakdeps]
CairoMakie = "13f3f980-e62b-5c42-98c6-ff1f3baf88f0"
MathTeXEngine = "0a4f8689-d25c-4efe-a92b-7142dfc1aa53"

[extensions]
Nbody6DynamicsMakieExt = ["CairoMakie", "MathTeXEngine"]

[compat]
Aqua = "0.8"
CairoMakie = "0.13, 0.15"
Dates = "1"
ExplicitImports = "1"
