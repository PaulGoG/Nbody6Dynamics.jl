# Corrections applied to the engine source tree before it is built; the fork
# carries all three from v2026.07-campaign.3 on, where they are found in place.
# file: path under the engine root; search: text that must occur exactly once;
# replace: its replacement.

[[amendment]]
id = "escape-summary-format"
file = "src/Main/escape.F"
search = "    4E13.5,I10,' JLIST: ',1000I10)"
replace = "    4E13.5,I10,' JLIST: ',1000(I10))"
description = "escaper summary: name list in a repeatable format group, so a step with more than 1000 escapers no longer ends the run with a format error"

[[amendment]]
id = "tidal-energy-total"
file = "src/Main/energy.F"
search = '''
*     ELSE
*       Employ general expression sum {m*r*F} for virial energy.
*         CALL XTRNLV(1,N)
'''
replace = '''
      ELSE IF (KZ(14).LE.2) THEN
*       Employ general expression sum {m*r*F} for virial energy.
          CALL XTRNLV(1,N)
'''
description = "energy evaluation: the whole-system call of XTRNLV is restored for a linearised external field (KZ(14) = 1, 2), so that its potential energy enters ETIDE, the total and the energy check, and the external virial term enters Q; the orbit modes (KZ(14) = 3, 5) keep the accumulated ETIDE and the original code path"

[[amendment]]
id = "tidal-energy-total-mpi"
file = "src/Main/energy_mpi.F"
search = '''
*     ELSE
*       Employ general expression sum {m*r*F} for virial energy.
*         CALL XTRNLV(1,N)
'''
replace = '''
      ELSE IF (KZ(14).LE.2) THEN
*       Employ general expression sum {m*r*F} for virial energy.
          CALL XTRNLV(1,N)
'''
description = "the same restoration in the MPI variant of the energy evaluation"
